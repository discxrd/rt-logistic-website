services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: lumargroup-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: lumargroup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
