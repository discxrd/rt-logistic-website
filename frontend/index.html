  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: 210 20% 98%;
      /* Off-white */
      --foreground: 224 25% 15%;
      /* Charcoal */

      --card: 0 0% 100%;
      --card-foreground: 224 25% 15%;

      --popover: 0 0% 100%;
      --popover-foreground: 224 25% 15%;

      --primary: 220 81% 52%;
      /* New Blue: #2364e7 */
      --primary-foreground: 210 20% 98%;
      /* Off-white */

      --secondary: 210 20% 94%;
      --secondary-foreground: 224 25% 15%;

      --muted: 210 20% 94%;
      --muted-foreground: 216 10% 45%;

      --accent: 210 20% 94%;
      --accent-foreground: 224 25% 15%;

      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;

      --border: 210 20% 88%;
      --input: 210 20% 88%;
      --ring: 220 81% 52%;

      --footer: 220 81% 52%;
      --footer-foreground: 210 20% 98%;

      --radius: 0.5rem;

      --font-sans: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-sans);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-sans);
      font-weight: 700;
      /* Re-apply bold for headings as serif is gone */
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: hsl(var(--secondary));
    }

    ::-webkit-scrollbar-thumb {
      background: hsl(var(--muted-foreground));
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--foreground));
    }

    /* Loader styles */
    .loader-container {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: hsl(var(--background));
      transition: opacity 0.5s ease-out;
    }

    .loader-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 8px solid hsl(var(--secondary));
      border-top-color: hsl(var(--primary));
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Scroll animation styles */
    .scroll-animate {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .scroll-animate.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hero on-load animation */
    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Staggered delay helper */
    .animation-delay-200 {
      animation-delay: 200ms;
    }

    .animation-delay-400 {
      animation-delay: 400ms;
    }

    .animation-delay-600 {
      animation-delay: 600ms;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            popover: {
              DEFAULT: 'hsl(var(--popover))',
              foreground: 'hsl(var(--popover-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
            footer: {
              DEFAULT: 'hsl(var(--footer))',
              foreground: 'hsl(var(--footer-foreground))',
            }
          },
          borderRadius: {
            lg: `var(--radius)`,
            md: `calc(var(--radius) - 2px)`,
            sm: 'calc(var(--radius) - 4px)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
